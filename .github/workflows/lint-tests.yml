name: Lint and tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "netbox_diode_plugin/**"
  push:
    branches:
      - "!release"
    paths:
      - "netbox_diode_plugin/**"

env:
  # Default NetBox version used for coverage reporting
  DEFAULT_NETBOX_VERSION: "v4.5.5"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: [ "3.10" ]
        netbox: [ "v4.5.5", "v4.4.10" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install .[dev]
          pip install .[test]
      - name: Lint with Ruff
        id: lint
        run: |
          ruff check --output-format=github netbox_diode_plugin/
        continue-on-error: true
      - name: Test
        id: test
        run: |
          make NETBOX_VERSION=${{ matrix.netbox }} docker-compose-netbox-plugin-test-cover
        continue-on-error: true
      - name: Check results
        if: always()
        run: |
          if [[ "${{ steps.lint.outcome }}" == "failure" || "${{ steps.test.outcome }}" == "failure" ]]; then
            echo "Either linting or tests failed"
            exit 1
          fi
      - name: Coverage comment
        uses: orgoro/coverage@3f13a558c5af7376496aa4848bf0224aead366ac # v3.2
        if: github.event.pull_request.head.repo.full_name == github.repository && matrix.netbox == env.DEFAULT_NETBOX_VERSION
        with:
          coverageFile: ./docker/coverage/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}

