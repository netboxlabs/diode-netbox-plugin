name: Lint and tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "netbox_diode_plugin/**"
      - ".github/workflows/lint-tests.yml"
      - "Makefile"
      - "docker/**"
  push:
    branches:
      - "!release"
    paths:
      - "netbox_diode_plugin/**"
      - ".github/workflows/lint-tests.yml"
      - "Makefile"
      - "docker/**"

env:
  # Default NetBox version used for coverage reporting
  DEFAULT_NETBOX_VERSION: "v4.6.10"

# One run per pull request (or per branch for pushes and manual dispatch), so
# PRs no longer queue behind each other repo-wide. Superseded runs are cancelled
# only for pull_request events; a push to a real branch always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python: [ "3.10" ]
        netbox: [ "v4.7.0", "v4.6.10", "v4.5.5", "v4.4.10" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install .[dev]
          pip install .[test]
      - name: Lint with Ruff
        id: lint
        run: |
          ruff check --output-format=github netbox_diode_plugin/
        continue-on-error: true
      - name: Test
        id: test
        run: |
          make NETBOX_VERSION=${{ matrix.netbox }} docker-compose-netbox-plugin-test-cover
        continue-on-error: true
      - name: Check results
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.lint.outcome }}" == "failure" || "${{ steps.test.outcome }}" == "failure" ]]; then
            echo "Either linting or tests failed"
            exit 1
          fi
      - name: Coverage comment
        uses: orgoro/coverage@53d6a49e69e38cf1606ea91ee3f4e64e2754fabb # v3.3.1
        if: github.event.pull_request.head.repo.full_name == github.repository && matrix.netbox == env.DEFAULT_NETBOX_VERSION
        with:
          coverageFile: ./docker/coverage/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}

