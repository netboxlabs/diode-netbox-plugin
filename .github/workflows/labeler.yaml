name: PR labeler
on:
  - pull_request_target

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/labeler@v6
        with:
          configuration-path: '.github/pull_request_labeler.yaml'
